[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "aqua-claima"
dynamic = ["version"]
authors = [
    {name = "Paolo Davini", email = "paolo.davini@cnr.it"},
]
description = "AQUA-claima: CLAIMA project configuration for the AQUA framework, shipped as an aqua-core plugin"
readme = "README.md"
keywords = ["climate", "modeling", "diagnostics", "CLAIMA"]
license = {file = "LICENSE"}
requires-python = ">=3.12,<3.15"
classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "aqua-core>=1.2.4",  # TODO: raise to 1.3.0 before releasing aqua-claima 0.1.0
    "aqua-diagnostics>=0.26.0",  # TODO: raise to 0.27.0 before releasing aqua-claima 0.1.0
    "packaging",
]

[project.optional-dependencies]
tests = [
    "pytest<9.2",  # as aqua-diagnostics: pytest 9.2 breaks xdist 3.8 loadgroup
    "pytest-cov",
    "pytest-mock",
    "pytest-xdist",
    "pytest-timeout",
    "coverage",
    "dvc>3.60.0",
    "dvc-s3"
]
docs = [
    "sphinx",
    "sphinx-rtd-theme"
]
style = [
    "pre-commit",
    "ruff==0.17.4"
]

[project.urls]
repository = "https://github.com/AQUA-friends/AQUA-claima/"
issues = "https://github.com/AQUA-friends/AQUA-claima/issues/"

[project.entry-points."aqua.plugins"]
claima = "aqua.claima:get_install_dirs"

[tool.setuptools.packages.find]
where = ["."]
include = ["aqua*"]

# Include non-Python files inside aqua/claima/config
[tool.setuptools.package-data]
"aqua" = [
    "claima/config/**/*",
]

[tool.setuptools.dynamic]
version = {attr = "aqua.claima.version.__version__"}

[tool.pytest.ini_options]
addopts = "--durations=10 -v"
testpaths = [
    "tests"
]
markers = [
    "claima: tests for the aqua-claima package",
]

[tool.coverage.run]
branch = true
source = ["aqua/claima"]
omit = [
    "tests/*",
]

[tool.ruff]
line-length = 127
target-version = "py312"
exclude = ["**/__init__.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N"]

[tool.ruff.lint.isort]
known-first-party = ["aqua"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.conda-lock]
default-non-conda-source = "pip"
platforms = [
    "linux-64",
]
