name: AQUA-claima PyPI tests
# Tests the public aqua-claima release from PyPI on a platform x Python matrix.
# Manual only until aqua-claima is on PyPI; then add the schedule (e.g. Tuesday after the aqua-diagnostics PyPI tests).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aqua-claima-pypi-tests:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        platform: [ubuntu-latest, macos-latest]
        python-version: ['3.12', '3.13', '3.14']
    name: AQUA-claima PyPI (${{ matrix.platform }}, py${{ matrix.python-version }})
    uses: ./.github/workflows/aqua-claima-test-reusable.yml
    with:
      platform: ${{ matrix.platform }}
      # Host runners, as a user installing from PyPI (no container)
      container-image: ''
      python-version: ${{ matrix.python-version }}
      pytest-markers: 'claima'
      enable-coverage: false
      install-mode: 'pypi'
      test-data-source: 'auto'
    secrets:
      AQUA_GITHUB_PAT: ${{ secrets.AQUA_GITHUB_PAT }}
      AQUA_DVC_PAT: ${{ secrets.AQUA_DVC_PAT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      POLYTOPE_KEY: ${{ secrets.POLYTOPE_KEY }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      AQUA_DVC_PEM: ${{ secrets.AQUA_DVC_PEM }}
